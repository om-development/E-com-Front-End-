<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Big gradient blob -->
  <circle cx="1350" cy="120" r="320" fill="#E0EAFF"/>

  <!-- Bottom blob -->
  <circle cx="150" cy="750" r="260" fill="#FFE7F1"/>

  <!-- Decorative waves -->
  <path d="M-100 250C250 50 450 450 800 250C1150 50 1350 450 1700 250"
        stroke="#D9E7FF"
        stroke-width="5"/>

  <path d="M-100 500C250 300 450 700 800 500C1150 300 1350 700 1700 500"
        stroke="#F8D7E5"
        stroke-width="5"/>

  <!-- Large rings -->
  <circle cx="1250" cy="650" r="140"
          stroke="#C9DDFF"
          stroke-width="10"
          fill="none"/>

  <circle cx="300" cy="200" r="100"
          stroke="#FFD4E4"
          stroke-width="10"
          fill="none"/>

  <!-- Hexagon -->
  <polygon points="1100,250 1150,220 1200,250 1200,310 1150,340 1100,310"
           fill="#EEF4FF"/>

  <!-- Floating squares -->
  <rect x="500" y="100"
        width="70"
        height="70"
        rx="15"
        transform="rotate(25 535 135)"
        fill="#E9F1FF"/>

  <rect x="900" y="700"
        width="90"
        height="90"
        rx="20"
        transform="rotate(-20 945 745)"
        fill="#FFEAF3"/>

  <!-- Dot clusters -->
  <g fill="#9CC2FF">
    <circle cx="1000" cy="100" r="6"/>
    <circle cx="1030" cy="130" r="6"/>
    <circle cx="1060" cy="100" r="6"/>
    <circle cx="1090" cy="130" r="6"/>
  </g>

  <g fill="#FF9BC0">
    <circle cx="250" cy="550" r="6"/>
    <circle cx="280" cy="580" r="6"/>
    <circle cx="310" cy="550" r="6"/>
    <circle cx="340" cy="580" r="6"/>
  </g>

  <!-- Abstract shape -->
  <path d="M1450 450C1500 350 1650 400 1600 550C1550 700 1350 650 1400 520C1420 480 1430 470 1450 450Z"
        fill="#EEF4FF"/>

</svg>