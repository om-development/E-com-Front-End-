<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp</title>
  <link rel="stylesheet" href="2nd-style.css">
</head>
<body>
  <header>
    <div class="logo">
      <a href="home.html"><img src="Images/logo.png"></a>
    </div>
    <div class="nav-home nav">
      <a href="home.html">Home</a>
    </div>
    <div class="login nav">
      <a href="login.html">Login</a>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="form-box">
       <h2>Sign in to eTrade</h2><br>
       <p>Enter your detail below</p>
       <form action="home.html">
        <div class="input-box">
          <span class="icon-box"><ion-icon name="person-outline"></ion-icon></span>
          <input type="text" placeholder="Username">
        </div>
        <div class="input-box">
          <span class="icon-box"><ion-icon name="mail-outline"></ion-icon></span>
          <input type="email" placeholder="Email" required>
        </div>
        <div class="input-box">
          <span class="icon-box"><ion-icon name="compass-outline"></ion-icon></span>
          <input type="password" placeholder="Password" required>
        </div>
        <div class="terms">
          <label><input type="checkbox">I accept the terms and conditions</label>
          <a href="home.html">Forgot Password?</a>
        </div>
        <button type="submit" class="btn">Sign Up</button>
       </form>
      </div>
    </div>
    <div class="send-home">
      <div class="title-2">We Offer the Best Products </div>
      <div class="visit">
        <button onclick="window.location.href='home.html'">Visit Us</button>
      </div>
    </div>
  </main>
  <footer>
    <div class="foot-detail">
      <h2>Contact Us</h2>
      <input type="email" placeholder="Enter Your Email"><button>Send</button>
      <h5>omdhakal1019@gmail.com</h5>
    </div>
    <div class="navigations">
      <a href="home.html">About</a>
      <a href="product.html">Categories</a>
      <a href="product.html">Shop</a>
      <a href="home.html">Deals</a>
      <a href="home.html">Support</a>
    </div>
  </footer>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
